
name: Autograding R

on:
  push:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код студента
      - name: Checkout student code
        uses: actions/checkout@v5

      # 2. Скачиваем скрытые тесты
      - name: Fetch hidden tests
        uses: actions/checkout@v5
        with:
          repository: rantiquity/01_03_Plots_Tests
          token: ${{ secrets.TESTS_DOWNLOAD_TOKEN }}
          path: hidden_tests_dir

      # 3. Устанавливаем актуальную стабильную версию R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # 4. Устанавливаем и кэшируем необходимые пакеты
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessionInfo
          cache-version: ${{ hashFiles('hidden_tests_dir/test_hidden.R') }}
          extra-packages: |
            any::testthat
            any::ggplot2
            any::languageR
            any::gradethis
            github::rstudio/ggcheck

      # 5. Запускаем скрытые тесты
      - name: Run hidden tests
        shell: Rscript {0}
        run: |
          results <- testthat::test_file(
            "hidden_tests_dir/test_hidden.R",
            reporter = "summary"
          )

          results_df <- as.data.frame(results)

          tests_failed <-
            sum(results_df$failed, na.rm = TRUE) > 0 ||
            sum(results_df$error, na.rm = TRUE) > 0

          if (tests_failed) {
            stop("Тесты не пройдены!", call. = FALSE)
          }

          message("Все тесты пройдены!")
